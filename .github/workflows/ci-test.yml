name: CI Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create docker network
        run: docker network create ydb-net || true

      - name: Start local YDB
        run: |
          docker run -d --rm --name ydb-local \
            --platform linux/amd64 \
            --network ydb-net \
            -p 2136:2136 -p 8765:8765 \
            -e YDB_USE_IN_MEMORY_PDISKS=true \
            -e GRPC_PORT=2136 \
            -e MON_PORT=8765 \
            ghcr.io/ydb-platform/local-ydb:latest

      - name: Wait for YDB endpoint
        run: |
          for i in {1..60}; do
            if docker run --rm --network ydb-net busybox sh -c "nc -z ydb-local 2136"; then
              echo "YDB is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "YDB is not reachable on 2136"
          docker logs ydb-local
          exit 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', '.devcontainer/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build driver image (devcontainer) with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          tags: ydb-c-binding-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Configure, build and run tests
        run: |
          mkdir -p .ccache
          docker run --rm --network ydb-net \
            -e YDB_ENDPOINT=ydb-local:2136 \
            -e YDB_DATABASE=/local \
            -e CCACHE_DIR=/ccache \
            -v "$PWD":/workspaces/ydb-c-binding \
            -v "$PWD/.ccache":/ccache \
            -w /workspaces/ydb-c-binding \
            ydb-c-binding-ci:latest \
            bash -lc "cmake -S . -B build -G Ninja \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache && \
              cmake --build build -j2 && \
              ctest --test-dir build --output-on-failure && \
              ccache -s"

      - name: Dump YDB logs on failure
        if: failure()
        run: docker logs ydb-local || true

      - name: Stop YDB
        if: always()
        run: docker stop ydb-local || true
